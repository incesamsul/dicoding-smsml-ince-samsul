name: SMSML CI
on:
  push:
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    env:
      MLFLOW_ALLOW_FILE_STORE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: Workflow-CI/MLProject
        run: pip install mlflow scikit-learn pandas numpy joblib
      - name: Run training
        working-directory: Workflow-CI/MLProject
        run: python modelling.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smsml-artifacts
          path: |
            Workflow-CI/MLProject/mlruns
            Workflow-CI/MLProject/model.joblib
            Workflow-CI/MLProject/metrics.json
